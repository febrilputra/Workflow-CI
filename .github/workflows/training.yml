name: Retrain Telco model and publish MLflow image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'MLProject/**'
      - '.github/workflows/training.yml'

permissions:
  contents: write

concurrency:
  group: telco-model-artifact-publishing
  cancel-in-progress: false

jobs:
  train-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MLFLOW_TRACKING_URI: file://${{ github.workspace }}/runtime/mlruns
      MLFLOW_EXPERIMENT_NAME: telco-churn-ci
      MPLBACKEND: Agg
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - name: Checkout training source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
          cache: pip
          cache-dependency-path: MLProject/requirements.txt
      - name: Install pinned dependencies
        run: python -m pip install -r MLProject/requirements.txt
      - name: Check serving startup retry behavior
        run: python -m unittest discover -s MLProject/tests -v
      - name: Retrain through MLflow Project
        run: |
          test -f MLProject/selected_params.json || { echo 'Run local tuning and copy its selected_params.json into MLProject first.' >&2; exit 1; }
          mlflow run ./MLProject --env-manager=local -P output_dir="$GITHUB_WORKSPACE/runtime/current"
      - name: Read exact run ID and package artifacts
        id: train
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          result = json.loads(Path('runtime/current/winner.json').read_text())
          assert result['run_id'] and (Path('runtime/current/model') / 'MLmodel').is_file()
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f"run_id={result['run_id']}\n")
          PY
          python MLProject/ci_artifacts.py bundle --output-dir runtime/current --data-dir MLProject/telco_churn_preprocessing --bundle-dir ci-artifacts
      - name: Checkout persistent artifact branch
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git ls-remote --exit-code --heads origin model-artifacts >/dev/null 2>&1; then
            git fetch origin model-artifacts
            git worktree add -B model-artifacts runtime/artifact-branch origin/model-artifacts
          else
            git worktree add --detach runtime/artifact-branch
            git -C runtime/artifact-branch switch --orphan model-artifacts
          fi
      - name: Save model permanently in this repository
        env:
          TRAIN_RUN_ID: ${{ steps.train.outputs.run_id }}
        run: |
          mkdir -p runtime/artifact-branch/artifacts
          printf '* -text\n' > runtime/artifact-branch/.gitattributes
          cp -R "ci-artifacts/artifacts/$TRAIN_RUN_ID" runtime/artifact-branch/artifacts/
          git -C runtime/artifact-branch add .gitattributes artifacts
          git -C runtime/artifact-branch commit -m "Store MLflow run $TRAIN_RUN_ID"
          git -C runtime/artifact-branch push origin model-artifacts
      - name: Require Docker Hub credentials for Advanced CI
        run: |
          test -n "$DOCKERHUB_USERNAME" || { echo 'Missing GitHub secret DOCKERHUB_USERNAME. Training artifacts were saved; Advanced CI is not complete.' >&2; exit 1; }
          test -n "$DOCKERHUB_TOKEN" || { echo 'Missing GitHub secret DOCKERHUB_TOKEN. Training artifacts were saved; Advanced CI is not complete.' >&2; exit 1; }
          echo "IMAGE_NAME=$DOCKERHUB_USERNAME/telco-churn:${GITHUB_SHA}-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"
      - name: Build image using MLflow
        run: mlflow models build-docker --model-uri runtime/current/model --name "$IMAGE_NAME" --env-manager local
      - name: Smoke-test the actual image against the saved model
        run: |
          docker run --detach --name telco-ci-model -p 5001:8080 "$IMAGE_NAME"
          python MLProject/ci_artifacts.py smoke --output-dir runtime/current --data-dir MLProject/telco_churn_preprocessing
      - name: Login and push image to Docker Hub
        run: |
          printf '%s' "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin
          docker push "$IMAGE_NAME"
          python MLProject/ci_artifacts.py deployment --output-dir runtime/current --image "$IMAGE_NAME" --commit "$GITHUB_SHA"
      - name: Persist deployment and serving proof with model
        env:
          TRAIN_RUN_ID: ${{ steps.train.outputs.run_id }}
        run: |
          python MLProject/ci_artifacts.py bundle --output-dir runtime/current --data-dir MLProject/telco_churn_preprocessing --bundle-dir ci-artifacts
          cp -R "ci-artifacts/artifacts/$TRAIN_RUN_ID/." "runtime/artifact-branch/artifacts/$TRAIN_RUN_ID/"
          git -C runtime/artifact-branch add artifacts
          git -C runtime/artifact-branch commit -m "Record tested Docker deployment for $TRAIN_RUN_ID"
          git -C runtime/artifact-branch push origin model-artifacts
          echo "Model run: $TRAIN_RUN_ID" >> "$GITHUB_STEP_SUMMARY"
          echo "Docker image: $IMAGE_NAME" >> "$GITHUB_STEP_SUMMARY"
          echo "[Persistent model artifacts](https://github.com/$GITHUB_REPOSITORY/tree/model-artifacts/artifacts/$TRAIN_RUN_ID)" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload supplementary run artifacts
        if: always() && steps.train.outputs.run_id != ''
        uses: actions/upload-artifact@v4
        with:
          name: telco-model-${{ steps.train.outputs.run_id }}
          path: ci-artifacts/artifacts/${{ steps.train.outputs.run_id }}
          if-no-files-found: error
          retention-days: 30
      - name: Capture logs and stop test container
        if: always()
        run: |
          docker logs telco-ci-model 2>/dev/null || true
          docker rm -f telco-ci-model 2>/dev/null || true
          docker logout >/dev/null 2>&1 || true
